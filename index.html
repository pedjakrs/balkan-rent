<!DOCTYPE html>
<html lang="sr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C8102E">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BRM">
<meta name="description" content="Balkan Rent Manager — interni sistem za rent-a-car poslovanje">
<title>Balkan Rent Manager</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23C8102E'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='700' font-size='26' fill='white' text-anchor='middle'%3EBR%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23C8102E'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='700' font-size='26' fill='white' text-anchor='middle'%3EBR%3C/text%3E%3C/svg%3E">
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --brand:#C8102E; --brand-600:#A70D26; --brand-50:#FDF2F3; --brand-100:#FBE3E6;
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#FAFAFB; --sidebar:#12161C; --sidebar-2:#1B212A;
  --text:#12161C; --text-2:#5A6472; --text-3:#8A93A0; --line:#E3E6EB; --line-2:#EDEFF3;
  --ok:#0E9F6E; --ok-bg:#E6F6F0; --warn:#D97706; --warn-bg:#FEF3E2; --danger:#DC2626; --danger-bg:#FDECEC;
  --info:#2563EB; --info-bg:#E8EFFD; --purple:#7C3AED; --purple-bg:#F1EAFE; --teal:#0D9488; --teal-bg:#E4F5F3;
  --indigo:#4F46E5; --indigo-bg:#ECEBFD; --gray-bg:#EEF0F3;
  --r:10px; --r-sm:7px; --r-lg:14px;
  --sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --sh-md:0 4px 12px rgba(16,24,40,.08);
  --sh-lg:0 12px 40px rgba(16,24,40,.16);
  --sb-w:246px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
html[data-theme="dark"]{
  --bg:#0C0F14; --surface:#151A21; --surface-2:#1A2029; --sidebar:#0A0D12; --sidebar-2:#151A21;
  --text:#E9ECF1; --text-2:#A3ACBA; --text-3:#6F7986; --line:#252C36; --line-2:#1E242D;
  --brand:#F04A5C; --brand-600:#D93B4C; --brand-50:#25161A; --brand-100:#2E1A1F;
  --ok-bg:#0F2A22; --warn-bg:#2A2010; --danger-bg:#2C1618; --info-bg:#131F38; --purple-bg:#1F1734;
  --teal-bg:#0C2523; --indigo-bg:#171634; --gray-bg:#1C222B;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-md:0 4px 14px rgba(0,0,0,.45); --sh-lg:0 16px 48px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--text-3);background-clip:content-box;border:3px solid transparent}

/* ============ APP SHELL ============ */
#app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sb-w);flex:0 0 var(--sb-w);background:var(--sidebar);color:#C9D1DC;
  display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:60;
}
.sb-brand{display:flex;align-items:center;gap:10px;padding:16px 18px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.sb-logo{width:34px;height:34px;border-radius:9px;background:var(--brand);display:grid;place-items:center;
  font-weight:800;color:#fff;font-size:15px;letter-spacing:-.5px;flex:0 0 auto}
.sb-brand b{color:#fff;font-size:14.5px;display:block;letter-spacing:-.2px}
.sb-brand span{font-size:11px;color:#78828F;display:block}
.sb-scroll{flex:1;overflow-y:auto;padding:10px 10px 18px}
.sb-scroll::-webkit-scrollbar-thumb{background:#2A323D;background-clip:content-box}
.sb-sec{font-size:11.5px;color:#6B7582;padding:14px 10px 6px;font-weight:600}
.nav-i{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:#B4BDCA;
  font-size:13.4px;cursor:pointer;margin-bottom:1px;transition:.13s;position:relative}
.nav-i:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-i.on{background:var(--brand);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(200,16,46,.35)}
.nav-i .ic{width:17px;text-align:center;font-size:14px;opacity:.9;flex:0 0 17px}
.nav-i .cnt{margin-left:auto;background:rgba(255,255,255,.12);color:#fff;font-size:10.5px;font-weight:700;
  padding:1px 6px;border-radius:20px;min-width:19px;text-align:center}
.nav-i.on .cnt{background:rgba(0,0,0,.25)}
.nav-i .cnt.hot{background:var(--brand);color:#fff}
.nav-i.on .cnt.hot{background:rgba(0,0,0,.3)}
.sb-user{border-top:1px solid rgba(255,255,255,.07);padding:11px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
.sb-user:hover{background:rgba(255,255,255,.04)}
.av{width:31px;height:31px;border-radius:50%;background:linear-gradient(135deg,var(--brand),#7C1020);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:0 0 auto}
.sb-user b{color:#fff;font-size:12.8px;display:block;line-height:1.3}
.sb-user span{font-size:11px;color:#78828F}

.main{flex:1;margin-left:var(--sb-w);min-width:0;display:flex;flex-direction:column}
.topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:12px;padding:0 20px;position:sticky;top:0;z-index:40}
.hamb{display:none;width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer}
.search{flex:1;max-width:440px;position:relative}
.search input{width:100%;height:34px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;
  padding:0 12px 0 32px;font-size:13px;outline:none}
.search input:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px var(--brand-100)}
.search .si{position:absolute;left:10px;top:8px;color:var(--text-3);font-size:13px}
.search kbd{position:absolute;right:8px;top:7px;font:600 10px var(--mono);color:var(--text-3);
  border:1px solid var(--line);border-radius:4px;padding:2px 5px;background:var(--surface)}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:6px}
.ibtn{width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;
  display:grid;place-items:center;font-size:14px;position:relative;color:var(--text-2)}
.ibtn:hover{background:var(--surface-2);color:var(--text)}
.dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--brand);border:1.5px solid var(--surface)}
.loc-pick{height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 8px;font-size:12.5px;cursor:pointer}

.page{padding:20px 22px 60px;flex:1;max-width:1620px;width:100%}
.ph{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{font-size:21px;font-weight:700;letter-spacing:-.4px;line-height:1.25}
.ph p{color:var(--text-2);font-size:13px;margin-top:2px}
.ph-a{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.crumb{font-size:12px;color:var(--text-3);margin-bottom:4px}
.crumb a{color:var(--brand);cursor:pointer}

/* ============ COMPONENTS ============ */
.btn{height:34px;padding:0 13px;border-radius:8px;border:1px solid var(--line);background:var(--surface);
  cursor:pointer;font-size:13px;font-weight:550;display:inline-flex;align-items:center;gap:6px;transition:.13s;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--text-3)}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 1px 3px rgba(200,16,46,.3)}
.btn.p:hover{background:var(--brand-600);border-color:var(--brand-600)}
.btn.gh{border-color:transparent;background:transparent;color:var(--text-2)}
.btn.gh:hover{background:var(--surface-2);color:var(--text)}
.btn.sm{height:28px;padding:0 10px;font-size:12.2px;border-radius:7px}
.btn.xs{height:24px;padding:0 8px;font-size:11.5px;border-radius:6px}
.btn.dn{color:var(--danger);border-color:var(--line)}
.btn.dn:hover{background:var(--danger-bg);border-color:var(--danger)}
.btn.blk{width:100%;justify-content:center}
.btn.lg{height:44px;font-size:14.5px;padding:0 18px;border-radius:10px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh)}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.card-h h3{font-size:14px;font-weight:650;letter-spacing:-.1px}
.card-h .sub{font-size:12px;color:var(--text-3);font-weight:400}
.card-h .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.card-b{padding:16px}
.card-b.tight{padding:0}
.card-f{padding:11px 16px;border-top:1px solid var(--line-2);background:var(--surface-2);
  border-radius:0 0 var(--r-lg) var(--r-lg);font-size:12.5px;color:var(--text-2)}

.grid{display:grid;gap:14px}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)} .g5{grid-template-columns:repeat(5,1fr)} .g6{grid-template-columns:repeat(6,1fr)}
.g-2-1{grid-template-columns:2fr 1fr} .g-1-2{grid-template-columns:1fr 2fr} .g-3-2{grid-template-columns:3fr 2fr}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 15px;
  box-shadow:var(--sh);cursor:pointer;transition:.14s;position:relative;overflow:hidden}
.kpi:hover{box-shadow:var(--sh-md);transform:translateY(-1px);border-color:var(--text-3)}
.kpi .lb{font-size:11.5px;color:var(--text-2);font-weight:550;display:flex;align-items:center;gap:6px}
.kpi .vl{font-size:25px;font-weight:700;letter-spacing:-.9px;margin-top:5px;line-height:1.1}
.kpi .dl{font-size:11.5px;color:var(--text-3);margin-top:3px}
.kpi .tr{font-size:11.5px;font-weight:650;margin-top:3px}
.kpi .tr.up{color:var(--ok)} .kpi .tr.dn{color:var(--danger)}
.kpi .strip{position:absolute;left:0;top:0;bottom:0;width:3px}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.3px;font-weight:650;padding:2.5px 8px;
  border-radius:20px;white-space:nowrap;line-height:1.45}
.badge .bd{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 6px}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn)}
.b-dn{background:var(--danger-bg);color:var(--danger)} .b-info{background:var(--info-bg);color:var(--info)}
.b-pu{background:var(--purple-bg);color:var(--purple)} .b-te{background:var(--teal-bg);color:var(--teal)}
.b-in{background:var(--indigo-bg);color:var(--indigo)} .b-gr{background:var(--gray-bg);color:var(--text-2)}
.b-bk{background:#2B303A;color:#fff}
html[data-theme="dark"] .b-bk{background:#3A414D}

table{width:100%;border-collapse:collapse}
th{font-size:11.5px;color:var(--text-2);font-weight:650;
  text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;position:sticky;top:0;z-index:2}
td{padding:9.5px 12px;border-bottom:1px solid var(--line-2);font-size:13px;vertical-align:middle}
tbody tr{cursor:pointer;transition:.1s}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.mono{font:12.5px var(--mono)}
.tw{overflow:auto;border-radius:0 0 var(--r-lg) var(--r-lg);max-height:none}
.t-main{font-weight:600}
.t-sub{font-size:11.6px;color:var(--text-3);margin-top:1px}
.plate{font:700 11.5px var(--mono);background:var(--gray-bg);border:1px solid var(--line);
  padding:1.5px 5px;border-radius:4px;letter-spacing:.3px;white-space:nowrap;display:inline-block}

.toolbar{display:flex;gap:7px;padding:11px 14px;border-bottom:1px solid var(--line-2);flex-wrap:wrap;align-items:center;background:var(--surface)}
.inp,.sel{height:32px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:0 9px;font-size:12.8px;outline:none}
.inp:focus,.sel:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-100)}
.sel{cursor:pointer;padding-right:24px;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%238A93A0' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 8px center}
textarea.inp{height:auto;padding:8px 9px;resize:vertical;width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:4px 11px;border-radius:20px;border:1px solid var(--line);background:var(--surface);
  font-size:12.3px;cursor:pointer;font-weight:550;transition:.12s;white-space:nowrap}
.chip:hover{border-color:var(--text-3)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip .n{opacity:.65;margin-left:3px;font-size:11px}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;padding:0 4px;background:var(--surface);
  border-radius:var(--r-lg) var(--r-lg) 0 0}
.tab{padding:10px 13px;font-size:13px;cursor:pointer;color:var(--text-2);border-bottom:2px solid transparent;
  white-space:nowrap;font-weight:550;transition:.12s}
.tab:hover{color:var(--text)}
.tab.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:650}
.tab .n{font-size:11px;background:var(--gray-bg);padding:1px 6px;border-radius:10px;margin-left:5px;color:var(--text-2)}

.fld{margin-bottom:13px}
.fld label{display:block;font-size:12.2px;font-weight:600;color:var(--text-2);margin-bottom:5px}
.fld label .req{color:var(--brand)}
.fld .inp,.fld .sel{width:100%;height:36px}
.fld .hint{font-size:11.4px;color:var(--text-3);margin-top:4px}
.frow{display:grid;gap:13px}

.dl-list{display:flex;flex-direction:column}
.dl-list>div{display:flex;justify-content:space-between;gap:14px;padding:7.5px 0;border-bottom:1px dashed var(--line-2);font-size:13px}
.dl-list>div:last-child{border-bottom:none}
.dl-list dt{color:var(--text-2);flex:0 0 auto}
.dl-list dd{font-weight:600;text-align:right}

.prog{height:6px;background:var(--gray-bg);border-radius:20px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:20px;background:var(--brand)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(84px,130px) 1fr 72px;gap:10px;align-items:center;font-size:12.5px}
.bar-tr{height:20px;background:var(--surface-2);border-radius:5px;overflow:hidden;position:relative;border:1px solid var(--line-2)}
.bar-tr i{display:block;height:100%;border-radius:4px 0 0 4px}

.empty{padding:46px 20px;text-align:center;color:var(--text-3)}
.empty .e-ic{font-size:30px;opacity:.35;margin-bottom:8px}
.empty b{display:block;color:var(--text-2);font-size:14px;margin-bottom:3px}

.alert{padding:10px 13px;border-radius:var(--r);font-size:12.8px;display:flex;gap:9px;align-items:flex-start;line-height:1.45}
.alert .ai{flex:0 0 auto;font-size:14px;line-height:1.3}
.a-warn{background:var(--warn-bg);color:#8A5209;border:1px solid rgba(217,119,6,.25)}
.a-dn{background:var(--danger-bg);color:#9B1C1C;border:1px solid rgba(220,38,38,.22)}
.a-ok{background:var(--ok-bg);color:#065F46;border:1px solid rgba(14,159,110,.22)}
.a-info{background:var(--info-bg);color:#1E40AF;border:1px solid rgba(37,99,235,.2)}
html[data-theme="dark"] .a-warn{color:#FBBF24} html[data-theme="dark"] .a-dn{color:#F87171}
html[data-theme="dark"] .a-ok{color:#34D399} html[data-theme="dark"] .a-info{color:#93B4FC}

/* ============ TIMELINE CALENDAR ============ */
.tl{overflow:auto;position:relative;background:var(--surface);border-radius:0 0 var(--r-lg) var(--r-lg)}
.tl-grid{min-width:1080px;position:relative}
.tl-head{display:grid;position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--line)}
.tl-head .cnr{position:sticky;left:0;z-index:7;background:var(--surface-2);border-right:1px solid var(--line);
  padding:7px 12px;font-size:11.5px;color:var(--text-2);font-weight:650;
  display:flex;align-items:center}
.tl-d{padding:5px 2px;text-align:center;border-right:1px solid var(--line-2);font-size:11px}
.tl-d b{display:block;font-size:13.5px;font-weight:650}
.tl-d span{color:var(--text-3);font-size:10px;text-transform:uppercase}
.tl-d.wknd{background:var(--surface-2)}
.tl-d.today{background:var(--brand-50)}
.tl-d.today b{color:var(--brand)}
.tl-grp{display:flex;align-items:center;gap:8px;padding:5px 12px;background:var(--surface-2);
  border-bottom:1px solid var(--line-2);font-size:12px;font-weight:650;color:var(--text-2);position:sticky;left:0}
.tl-row{display:grid;border-bottom:1px solid var(--line-2);position:relative;min-height:44px}
.tl-row:hover .tl-veh{background:var(--surface-2)}
.tl-veh{position:sticky;left:0;z-index:5;background:var(--surface);border-right:1px solid var(--line);
  padding:6px 10px;display:flex;align-items:center;gap:8px;cursor:pointer}
.tl-veh:hover{background:var(--surface-2)!important}
.tl-veh .nm{font-size:12.6px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-veh .mt{font-size:10.6px;color:var(--text-3);display:flex;gap:5px;align-items:center;margin-top:1px}
.tl-cells{position:absolute;inset:0;display:grid;pointer-events:none}
.tl-cell{border-right:1px solid var(--line-2);pointer-events:auto;cursor:crosshair}
.tl-cell:hover{background:var(--brand-50)}
.tl-cell.wknd{background:rgba(0,0,0,.014)}
.tl-cell.today{box-shadow:inset 2px 0 0 var(--brand),inset -2px 0 0 rgba(200,16,46,.15)}
html[data-theme="dark"] .tl-cell.wknd{background:rgba(255,255,255,.022)}
.tl-bar{position:absolute;top:6px;height:32px;border-radius:6px;padding:0 8px;display:flex;align-items:center;gap:5px;
  font-size:11.4px;font-weight:600;color:#fff;cursor:pointer;overflow:hidden;z-index:3;
  box-shadow:0 1px 3px rgba(0,0,0,.22);white-space:nowrap;transition:.12s}
.tl-bar:hover{filter:brightness(1.09);transform:translateY(-1px);box-shadow:0 3px 9px rgba(0,0,0,.28);z-index:4}
.tl-bar .pill{background:rgba(255,255,255,.25);border-radius:4px;padding:0 4px;font-size:10px;font-weight:700}
.tl-bar.hatch{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 5px,transparent 5px 10px)}
.lgnd{display:flex;gap:13px;flex-wrap:wrap;font-size:11.7px;color:var(--text-2);align-items:center}
.lgnd i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}

/* ============ MODAL / DRAWER ============ */
.ovl{position:fixed;inset:0;background:rgba(12,16,22,.5);z-index:100;display:none;
  align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.ovl.on{display:flex}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-lg);width:100%;max-width:620px;
  max-height:88vh;display:flex;flex-direction:column;animation:pop .16s ease-out;border:1px solid var(--line)}
.modal.wide{max-width:960px} .modal.narrow{max-width:440px}

let sb = null;

function normErr(e) {
  if (!e) return new Error('Nepoznata greška.');
  const raw = [e.message, e.details, e.hint, e.code].filter(Boolean).join(' ');
  // poruke iz baze (RAISE EXCEPTION) su već na srpskom — prikazujemo ih direktno
  if (e.code === 'P0001' && e.message) return new Error(e.message);
  for (const [re, msg] of ERRMAP) if (re.test(raw)) return new Error(e.code === '42501' && e.message && /[čćšžđ]/i.test(e.message) ? e.message : msg);
  return new Error(e.message || String(e));
}
async function q(builder) {
  const { data, error } = await builder;
  if (error) throw normErr(error);
  return data;
}
const db = t => sb.from(t);
async function rpc(fn, args) {
  const { data, error } = await sb.rpc(fn, args || {});
  if (error) throw normErr(error);
  return data;
}

/* ---------- UI: toast, modal, dijalozi ---------- */
function toast(msg, kind = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + kind; t.setAttribute('role', 'status');
  t.innerHTML = (kind === 'err' ? '⚠ ' : kind === 'ok' ? '✓ ' : '') + esc(msg);
  document.body.appendChild(t);
  setTimeout(() => t.remove(), kind === 'err' ? 5200 : 2800);
}
const MSTACK = [];
function modal({ title, body = '', foot = '', size = '', onClose } = {}) {
  const ovl = document.createElement('div');
  ovl.className = 'ovl on';
  ovl.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true" aria-label="${attr(title)}">
    <div class="m-h"><h3>${esc(title)}</h3><button class="x" data-x aria-label="Zatvori">✕</button></div>
    <div class="m-b">${body}</div>${foot ? `<div class="m-f">${foot}</div>` : ''}</div>`;
  document.body.appendChild(ovl); document.body.classList.add('locked');
  const close = () => { ovl.remove(); const i = MSTACK.indexOf(rec); if (i >= 0) MSTACK.splice(i, 1); if (!MSTACK.length) document.body.classList.remove('locked'); onClose && onClose(); };
  const rec = { el: ovl, close };
  MSTACK.push(rec);
  ovl.addEventListener('mousedown', e => { if (e.target === ovl) close(); });
  $('[data-x]', ovl).onclick = close;
  setTimeout(() => { const f = $('input:not([type=hidden]):not([readonly]),select,textarea', $('.m-b', ovl)); f && f.focus(); }, 30);
  return { el: ovl, body: $('.m-b', ovl), close };
}
function closeModal() { const m = MSTACK[MSTACK.length - 1]; m && m.close(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && MSTACK.length) closeModal(); });
function confirmDlg(text, { ok = 'Potvrdi', danger = false, title = 'Potvrda' } = {}) {
  return new Promise(res => {
    let done = false;
    const m = modal({ title, size: 'narrow', body: `<p style="font-size:13.5px">${text}</p>`,
      foot: `<button class="btn" data-n>Odustani</button><button class="btn ${danger ? 'dn' : 'p'}" data-y>${esc(ok)}</button>`,
      onClose: () => { if (!done) res(false); } });
    $('[data-n]', m.el).onclick = () => { m.close(); };
    $('[data-y]', m.el).onclick = () => { done = true; m.close(); res(true); };
  });
}
function promptDlg(title, label, { ok = 'Potvrdi', required = true, multiline = true, value = '', danger = false } = {}) {
  return new Promise(res => {
    let done = false;
    const inp = multiline ? `<textarea class="inp" rows="3" data-v>${esc(value)}</textarea>` : `<input class="inp" data-v value="${attr(value)}">`;
    const m = modal({ title, size: 'narrow', body: fld(label, inp, { req: required }),
      foot: `<button class="btn" data-n>Odustani</button><button class="btn ${danger ? 'dn' : 'p'}" data-y>${esc(ok)}</button>`,
      onClose: () => { if (!done) res(null); } });
    $('[data-n]', m.el).onclick = () => m.close();
    $('[data-y]', m.el).onclick = () => {
      const v = $('[data-v]', m.el).value.trim();
      if (required && !v) { toast('Polje je obavezno.', 'err'); return; }
      done = true; m.close(); res(v);
    };
  });
}
/* zaštićena akcija: dugme u busy stanju, greška u toast */
async function act(btn, fn, okMsg) {
  if (btn && btn.classList.contains('busy')) return;
  btn && btn.classList.add('busy');
  try { const r = await fn(); if (okMsg) toast(okMsg, 'ok'); return r; }
  catch (e) { console.error(e); toast(e.message || String(e), 'err'); }
  finally { btn && btn.classList.remove('busy'); }
}

}
const req = o => (o.req ? ` data-req="1"` : '') + (o.dis ? ' disabled' : '') + (o.ro ? ' readonly' : '') + (o.extra ? ' ' + o.extra : '');
const F = {
  text: (n, l, v, o = {}) => fld(l, `<input class="inp" name="${n}" data-label="${attr(l)}" value="${attr(v ?? '')}"${o.ph ? ` placeholder="${attr(o.ph)}"` : ''}${o.type ? ` type="${o.type}"` : ''}${req(o)}>`, o),
  num: (n, l, v, o = {}) => fld(l, `<input class="inp" name="${n}" data-label="${attr(l)}" data-t="num" type="number" step="${o.step || 'any'}"${o.min !== undefined ? ` min="${o.min}"` : ''} value="${v == null ? '' : attr(v)}"${req(o)}>`, o),
  int: (n, l, v, o = {}) => F.num(n, l, v, { ...o, step: 1 }),
  date: (n, l, v, o = {}) => fld(l, `<input class="inp" type="date" name="${n}" data-label="${attr(l)}" value="${v ? attr(String(v).slice(0, 10)) : ''}"${req(o)}>`, o),
  dt: (n, l, v, o = {}) => fld(l, `<input class="inp" type="datetime-local" name="${n}" data-label="${attr(l)}" data-t="dt" value="${attr(toLocalInput(v))}"${req(o)}>`, o),
  sel: (n, l, opts, o = {}) => fld(l, `<select class="sel" name="${n}" data-label="${attr(l)}"${req(o)}>${opts}</select>`, o),
  area: (n, l, v, o = {}) => fld(l, `<textarea class="inp" rows="${o.rows || 3}" name="${n}" data-label="${attr(l)}"${req(o)}>${esc(v ?? '')}</textarea>`, o),
  chk: (n, l, v, o = {}) => `<label class="chk"><input type="checkbox" name="${n}"${v ? ' checked' : ''}${o.dis ? ' disabled' : ''}> ${esc(l)}</label>`
};
function readForm(root) {
  const o = {};
  $$('[name]', root).forEach(el => {
    if (el.disabled && !el.dataset.keep) return;
    let v;
    if (el.type === 'checkbox') v = el.checked;
    else if (el.dataset.t === 'num') v = el.value === '' ? null : +String(el.value).replace(',', '.');
    else if (el.dataset.t === 'dt') v = el.value ? new Date(el.value).toISOString() : null;
    else v = el.value.trim() === '' ? null : el.value.trim();
    if (el.dataset.req && (v === null || v === '' || (typeof v === 'number' && isNaN(v)))) {
      el.focus(); throw new Error('Popunite obavezno polje: ' + (el.dataset.label || el.name) + '.');
    }
    if (el.dataset.t === 'num' && v !== null && isNaN(v)) { el.focus(); throw new Error('Neispravan broj: ' + (el.dataset.label || el.name) + '.'); }
    o[el.name] = v;
  });
  return o;
}

/* SVG grafikon prihod/trošak po periodima */
function barChart(rows, { h = 200 } = {}) {
  if (!rows.length) return '';
  const W = Math.max(rows.length * 56, 320), pad = 28;
  const max = Math.max(1, ...rows.map(r => Math.max(r.a || 0, r.b || 0)));
  const bw = (W - pad) / rows.length;
  let g = '';
  rows.forEach((r, i) => {
    const x = pad + i * bw + bw * 0.14, w = bw * 0.34;
    const ha = (r.a || 0) / max * (h - 40), hb = (r.b || 0) / max * (h - 40);
    g += `<rect x="${x}" y="${h - 22 - ha}" width="${w}" height="${ha}" rx="3" fill="var(--brand)"><title>${esc(r.label)} — prihod ${money0(r.a)}</title></rect>`;
    g += `<rect x="${x + w + 2}" y="${h - 22 - hb}" width="${w}" height="${hb}" rx="3" fill="var(--text-3)" opacity=".55"><title>${esc(r.label)} — trošak ${money0(r.b)}</title></rect>`;
    g += `<text x="${x + w}" y="${h - 6}" text-anchor="middle">${esc(r.label)}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${h}" role="img" aria-label="Prihod i trošak po periodima">
    <line x1="${pad}" x2="${W}" y1="${h - 22}" y2="${h - 22}" stroke="var(--line)"/>${g}</svg>
    <div class="lgnd mt8"><span><i style="background:var(--brand)"></i>Prihod (neto)</span><span><i style="background:var(--text-3);opacity:.55"></i>Trošak</span></div></div>`;
}

/* ---------- STORAGE: kompresija i upload ---------- */
async function compressImage(file, max = 1600, quality = 0.78) {
  if (!file || !/^image\//.test(file.type) || file.type === 'image/svg+xml') return file;
  try {
    const src = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(file); });
    const r = Math.min(1, max / Math.max(src.naturalWidth, src.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(src.naturalWidth * r); c.height = Math.round(src.naturalHeight * r);
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
    URL.revokeObjectURL(src.src);
    const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', quality));
    return blob && blob.size < file.size ? blob : file;
  } catch (e) { return file; }
}
async function upload(path, blob, type) {
  const { error } = await sb.storage.from(CONFIG.BUCKET).upload(path, blob, { contentType: type || blob.type || 'application/octet-stream', upsert: false });
  if (error) throw new Error('Otpremanje fajla nije uspelo: ' + error.message);
  return path;
}
async function signedUrls(paths) {
  const list = (paths || []).filter(Boolean);
  if (!list.length) return {};
  const { data, error } = await sb.storage.from(CONFIG.BUCKET).createSignedUrls(list, 3600);
  if (error) return {};
  const m = {}; (data || []).forEach(d => { if (d.signedUrl) m[d.path] = d.signedUrl; });
  return m;
}
async function openFile(path) {
  const w = window.open('', '_blank');
  const m = await signedUrls([path]);
  if (m[path]) { if (w) w.location = m[path]; else location.href = m[path]; } else { w && w.close(); toast('Fajl nije dostupan.', 'err'); }
}
const safeName = n => (n || 'fajl').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w.\-]+/g, '_').slice(-80);
function pickFile(accept = 'image/*,application/pdf', capture = false) {
  return new Promise(res => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = accept; if (capture) i.setAttribute('capture', 'environment');
    i.onchange = () => res(i.files && i.files[0] ? i.files[0] : null); i.click();
  });
}
async function uploadDoc(entity, entityId, file, docType = null, note = null) {
  const blob = await compressImage(file);
  const ext = blob.type === 'image/jpeg' ? '.jpg' : (file.name.match(/\.[a-z0-9]+$/i) || [''])[0];
  const path = `${entity}/${entityId || 'opste'}/${Date.now()}_${safeName(file.name.replace(/\.[^.]+$/, ''))}${ext}`;
  await upload(path, blob, blob.type || file.type);
  await q(db('files').insert({ entity, entity_id: entityId, path, name: file.name, mime: blob.type || file.type, size: blob.size, doc_type: docType, note }));
  return path;
}

S.cal = { start: addDays(today(), -2), days: 21, cat: '', mode: 'all', group: 'cat', day: today() };
const CAL_COL = { confirmed: '#2563EB', deposit_paid: '#0D9488', active: '#DC2626', returned: '#64748B', closed: '#94A3B8', disputed: '#374151' };
function calColor(e) {
  if (e.kind === 'block') return e.color || '#7C3AED';
  if (e.status === 'active' && e.is_late) return '#111827';
  if (e.status === 'active' && startOfDay(e.ends_at).getTime() === today().getTime()) return '#D97706';
  return CAL_COL[e.status] || '#2563EB';
}
function calShift(n) { S.cal.start = n === 0 ? addDays(today(), -2) : addDays(S.cal.start, n); render(); }

SCREENS.calendar = async () => {
  const c = S.cal, mobile = window.innerWidth < 860;
  const from = mobile ? startOfDay(c.day) : startOfDay(c.start), to = addDays(from, mobile ? 1 : c.days);
  const [veh, ev] = await Promise.all([
    q(db('v_vehicles').select('id,plate,make,model,category_id,category_code,category_name,location_id,location_name,op_status,cleanliness,lifecycle,reg_until,service_next_date,service_next_km,odometer')
      .in('lifecycle', ['active', 'for_sale']).order('plate')),
    q(db('v_calendar').select('*').lt('starts_at', to.toISOString()).gt('ends_at', from.toISOString()).limit(2000))
  ]);
  const byV = groupBy(ev, e => e.vehicle_id);
  let vs = veh.filter(inLoc).filter(v => !c.cat || v.category_id === c.cat);
  const problem = v => ['late', 'blocked'].includes(v.op_status) || v.cleanliness !== 'clean' || (v.reg_until && daysTo(v.reg_until) <= 15) || (v.service_next_km && v.service_next_km - v.odometer <= 1000);
  if (c.mode === 'free') vs = vs.filter(v => !(byV[v.id] || []).some(e => new Date(e.starts_at) < to && new Date(e.ends_at) > from && !['returned', 'closed'].includes(e.status)));
  if (c.mode === 'prob') vs = vs.filter(problem);

  const acts = (can('resWrite') ? `<button class="btn p" onclick="go('reservation-new')">+ Rezervacija</button>` : '');
  const chips = `<div class="chips"><span class="chip${!c.cat ? ' on' : ''}" onclick="S.cal.cat='';render()">Sve</span>${activeCats().map(k => `<span class="chip${c.cat === k.id ? ' on' : ''}" onclick="S.cal.cat='${k.id}';render()">${esc(k.code)}<span class="n">${veh.filter(v => v.category_id === k.id && inLoc(v)).length}</span></span>`).join('')}</div>
    <div class="chips"><span class="chip${c.mode === 'all' ? ' on' : ''}" onclick="S.cal.mode='all';render()">Sva vozila</span><span class="chip${c.mode === 'free' ? ' on' : ''}" onclick="S.cal.mode='free';render()">Samo slobodna</span><span class="chip${c.mode === 'prob' ? ' on' : ''}" onclick="S.cal.mode='prob';render()">Samo problemi</span></div>`;

  if (mobile) { // dnevni pregled za telefon
    const rows = vs.map(v => {
      const evs = (byV[v.id] || []).sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));
      const st = evs.length ? evs.map(e => `<span class="badge" style="background:${calColor(e)};color:#fff">${e.kind === 'block' ? esc(e.label) : esc((e.label || '').split(' ')[0]) + ' ' + fmtT(e.starts_at) + '–' + fmtT(e.ends_at)}</span>`).join(' ') : '<span class="badge b-ok">Slobodno ceo dan</span>';
      return `<div class="dl-row" onclick="${evs[0] && evs[0].kind === 'reservation' ? `go('reservation','${evs[0].id}')` : `go('vehicle','${v.id}')`}"><span class="dot-s" style="background:${(VEH_OP[v.op_status] || [])[2] || '#999'}"></span>
        <div style="flex:1;min-width:0"><b>${esc(v.plate)}</b> <span class="t-sub">${esc(v.make + ' ' + v.model)} · ${esc(v.category_code)}</span><div class="mt8" style="display:flex;gap:4px;flex-wrap:wrap">${st}</div></div></div>`;
    }).join('');
    return ph('Kalendar', 'Dnevni pregled — izaberite dan.', acts) + `<div class="card"><div class="toolbar">
      <button class="btn sm" onclick="S.cal.day=addDays(S.cal.day,-1);render()">‹</button><input type="date" class="inp" value="${isoDate(c.day)}" onchange="S.cal.day=toDate(this.value);render()"><button class="btn sm" onclick="S.cal.day=addDays(S.cal.day,1);render()">›</button>
      <button class="btn sm" onclick="S.cal.day=today();render()">Danas</button></div><div class="toolbar">${chips}</div><div class="day-list">${rows || empty('Nema vozila za izabrani filter.')}</div></div>`;
  }

  const N = c.days, VW = 210, colTpl = `${VW}px repeat(${N},minmax(44px,1fr))`;
  const days = Array.from({ length: N }, (_, i) => addDays(from, i));
  const posL = d => `calc(${VW}px + ${d} * ((100% - ${VW}px) / ${N}))`;
  let h = ph('Kalendar dostupnosti', 'Jedini merodavni prikaz zauzeća. Klik na prazno polje otvara novu rezervaciju za to vozilo i dan.',
    `<button class="btn" onclick="calShift(-7)">‹ Nedelja</button><button class="btn" onclick="calShift(0)">Danas</button><button class="btn" onclick="calShift(7)">Nedelja ›</button>
     <select class="sel" onchange="S.cal.days=+this.value;render()">${[14, 21, 31, 45].map(n => `<option value="${n}"${N === n ? ' selected' : ''}>${n} dana</option>`).join('')}</select>
     <select class="sel" onchange="S.cal.group=this.value;render()"><option value="cat"${c.group === 'cat' ? ' selected' : ''}>Po kategoriji</option><option value="loc"${c.group === 'loc' ? ' selected' : ''}>Po lokaciji</option></select>${acts}`);
  h += `<div class="card"><div class="toolbar">${chips}<div style="margin-left:auto" class="lgnd">${[['#2563EB', 'Potvrđeno'], ['#0D9488', 'Avans plaćen'], ['#DC2626', 'Izdato'], ['#D97706', 'Povrat danas'], ['#111827', 'Kasni'], ['#94A3B8', 'Završeno'], ['#7C3AED', 'Blokada']].map(([k, n]) => `<span><i style="background:${k}"></i>${n}</span>`).join('')}</div></div>`;
  h += `<div class="tl"><div class="tl-grid"><div class="tl-head" style="grid-template-columns:${colTpl}"><div class="cnr">Vozilo (${vs.length})</div>` +
    days.map(d => { const wk = [0, 6].includes(d.getDay()), td = d.getTime() === today().getTime();
      return `<div class="tl-d${wk ? ' wknd' : ''}${td ? ' today' : ''}"><b>${d.getDate()}</b><span>${DOW[d.getDay()]}${d.getDate() === 1 ? ' · ' + MONTHS[d.getMonth()].slice(0, 3) : ''}</span></div>`; }).join('') + `</div>`;
  const groups = groupBy(vs, v => c.group === 'cat' ? (v.category_code + ' — ' + v.category_name) : (v.location_name || 'Bez lokacije'));
  const nowOff = (Date.now() - from.getTime()) / 864e5;
  Object.keys(groups).sort().forEach(g => {
    h += `<div class="tl-grp">${esc(g)} <span class="tag">${groups[g].length}</span></div>`;
    groups[g].forEach(v => {
      const op = VEH_OP[v.op_status] || VEH_OP.free;
      h += `<div class="tl-row" style="grid-template-columns:${colTpl}"><div class="tl-veh" onclick="go('vehicle','${v.id}')">
        <span class="dot-s" style="background:${op[2]}" title="${attr(op[0])}"></span><div style="min-width:0"><div class="nm">${esc(v.make + ' ' + v.model)}</div>
        <div class="mt"><span class="plate" style="font-size:9.5px;padding:0 3px">${esc(v.plate)}</span>${v.cleanliness !== 'clean' ? '<span class="warn-t" title="Nije oprano">●</span>' : ''}</div></div></div>
        <div class="tl-cells" style="grid-template-columns:${colTpl}"><div></div>${days.map(d => { const wk = [0, 6].includes(d.getDay()), td = d.getTime() === today().getTime();
          return `<div class="tl-cell${wk ? ' wknd' : ''}${td ? ' today' : ''}" onclick="calNew('${v.id}','${isoDate(d)}')"></div>`; }).join('')}</div>`;
      if (nowOff > 0 && nowOff < N) h += `<div class="tl-now" style="left:${posL(nowOff)}"></div>`;
      (byV[v.id] || []).forEach(e => {
        const s = Math.max(0, (new Date(e.starts_at) - from) / 864e5), en = Math.min(N, (new Date(e.ends_at) - from) / 864e5);
        if (en <= 0 || s >= N) return;
        const w = Math.max(en - s, 0.12), col = calColor(e), hist = ['returned', 'closed'].includes(e.status);
        const label = e.kind === 'block' ? e.label : (e.is_late ? '⏰ ' : '') + (e.label || '');
        h += `<div class="tl-bar${e.kind === 'block' ? ' hatch' : ''}${hist ? ' hist' : ''}" style="left:calc(${posL(s)} + 1px);width:calc(${w} * ((100% - ${VW}px) / ${N}) - 2px);background:${col}"
          title="${attr((e.ref ? e.ref + ' · ' : '') + (e.label || '') + ' · ' + fmtDT(e.starts_at) + ' – ' + fmtDT(e.ends_at))}" onclick="event.stopPropagation();calPeek('${e.kind}','${e.id}')">
          <span style="overflow:hidden;text-overflow:ellipsis">${esc(label)}</span>${e.kind === 'reservation' && w > 2.5 && e.total_amount ? `<span class="pill">${esc(money0(e.total_amount, e.currency))}</span>` : ''}</div>`;
      });
      h += `</div>`;
    });
  });
  if (!vs.length) h += empty('Nema vozila za izabrani filter.');
  h += `</div></div><div class="card-f">Zauzeće uključuje vreme pripreme vozila posle povrata. Dupla rezervacija istog vozila je onemogućena u bazi.</div></div>`;
  return h;
};
function calNew(vid, iso) {
  if (!can('resWrite')) return;
  const p = new Date(iso + 'T09:00:00');
  if (p < new Date()) p.setTime(Math.ceil(Date.now() / 18e5) * 18e5);
  go('reservation-new', { vehicle: vid, from: p.toISOString(), to: addDays(p, 1).toISOString() });
}
async function calPeek(kind, id) {
  if (kind === 'block') {
    const b = (await q(db('vehicle_blocks').select('*').eq('id', id)))[0];
    if (!b) return;
    const m = modal({ title: 'Blokada vozila', size: 'narrow', body: `<dl class="kv"><dt>Razlog</dt><dd>${esc(L.br(b.reason_id).name)}</dd><dt>Od</dt><dd>${fmtDT(b.starts_at)}</dd><dt>Do</dt><dd>${fmtDT(b.ends_at)}</dd><dt>Napomena</dt><dd>${esc(b.note || '—')}</dd><dt>Uneo</dt><dd>${esc(L.pr(b.created_by))}</dd></dl>`,
      foot: `<button class="btn" onclick="closeModal();go('vehicle','${b.vehicle_id}')">Kartica vozila</button>${can('ops') ? `<button class="btn dn" id="bkDel">Obriši</button><button class="btn p" id="bkEnd">Završi sada</button>` : ''}` });
    if (can('ops')) {
      $('#bkEnd', m.el).onclick = e => act(e.target, async () => { await rpc('end_block', { p_id: id, p_delete: false }); m.close(); render(); }, 'Blokada je završena.');
      $('#bkDel', m.el).onclick = async e => { if (await confirmDlg('Obrisati blokadu?', { danger: true, ok: 'Obriši' })) act(e.target, async () => { await rpc('end_block', { p_id: id, p_delete: true }); m.close(); render(); }, 'Blokada je obrisana.'); };
    }
    return;
  }
  const r = (await q(db('v_reservations').select('*').eq('id', id)))[0];
  if (!r) return;

function rfRead() {

  ['pickup_at', 'return_at', 'pickup_location_id', 'return_location_id', 'category_id', 'vehicle_id', 'driver_id', 'additional_drivers', 'source', 'notes', 'status', 'keep_price']
    .forEach(n => { const v = val(n); if (v !== undefined) RF[n] = v; });
  ['discount_pct', 'deposit_amount', 'km_limit'].forEach(n => { const v = val(n); RF[n] = v === null || v === undefined ? null : +String(v).replace(',', '.'); });
  RF.extras = {};

function rfPayload() {

async function hoPhoto(k, input) {
  const file = input.files && input.files[0]; if (!file) return;

let SIG = null;
function sigInit(cv) {
  const ctx = cv.getContext && cv.getContext('2d'); if (!ctx) return;
  const ratio = window.devicePixelRatio || 1;
  cv.width = cv.offsetWidth * ratio; cv.height = cv.offsetHeight * ratio; ctx.scale(ratio, ratio);
  ctx.lineWidth = 2.3; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111';
  let drawing = false, last = null;
  const pos = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  cv.onpointerdown = e => { drawing = true; last = pos(e); cv.setPointerCapture && cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = e => { if (!drawing) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; HO.sig = true; };
  cv.onpointerup = cv.onpointercancel = cv.onpointerleave = () => { drawing = false; };
  SIG = { cv, ctx };
}
function sigClear() { if (!SIG) return; SIG.ctx.clearRect(0, 0, SIG.cv.width, SIG.cv.height); HO.sig = false; }
async function hoSubmit(btn) {
  const f = $('#hoForm'), isRet = HO.type === 'return';

    if (km < minKm) throw new Error(`Kilometraža ne može biti manja od ${int(minKm)} km.`);
    if (isRet && HO.r.pickup_odometer != null && km - HO.r.pickup_odometer > 5000 && !(await confirmDlg(`Pređeno je ${int(km - HO.r.pickup_odometer)} km. Da li je kilometraža tačna?`, { ok: 'Tačno je' }))) return;
    if (photos.length < HO.min) throw new Error(`Potrebno je najmanje ${HO.min} fotografija (imate ${photos.length}).`);
    if (!HO.sig) throw new Error('Nedostaje potpis klijenta.');
    if (!isRet && $('#hoTerms') && !$('#hoTerms').checked) throw new Error('Potvrdite da je klijent upoznat sa uslovima najma.');
  } catch (e) { toast(e.message, 'err'); return; }

    toast(isRet ? 'Vozilo je primljeno.' : 'Vozilo je izdato.', 'ok');
    refreshCounts();
    if (isRet && res.suggestions && res.suggestions.length) return suggestDlg(HO.id, HO.r.currency, res.suggestions);

    go('reservation', HO.id);

async function docsBlock(entity, id) {
  const fl = await q(db('files').select('*').eq('entity', entity).eq('entity_id', id).is('deleted_at', null).order('created_at', { ascending: false }));
  return `<div class="row mb12"><b style="font-size:13.5px">Dokumenti i slike</b><span class="sp"></span><button class="btn sm" onclick="docAdd('${entity}','${id}')">+ Dodaj fajl</button></div>
    ${fl.length ? `<div class="tw"><table><thead><tr><th></th><th>Naziv</th><th>Vrsta</th><th>Dodato</th><th></th></tr></thead><tbody>${fl.map(x => `<tr onclick="openFile('${attr(x.path)}')">

      <td>${esc(x.doc_type || '—')}</td><td class="t-sub">${fmtDT(x.created_at)} · ${esc(L.pr(x.uploaded_by))}</td>
      <td class="right">${can('mgmt') || x.uploaded_by === S.me.id ? `<button class="btn xs gh" onclick="event.stopPropagation();docDel('${x.id}')">Ukloni</button>` : ''}</td></tr>`).join('')}</tbody></table></div>` : '<div class="t-sub">Nema priloženih dokumenata.</div>'}`;
}
async function docAdd(entity, id) {
  const file = await pickFile(); if (!file) return;
  if (file.size > 25 * 1024 * 1024) { toast('Fajl je veći od 25 MB.', 'err'); return; }
  const dt = await promptDlg('Vrsta dokumenta', 'Npr. saobraćajna, polisa, lična karta, vozačka, ugovor', { multiline: false, required: false, ok: 'Otpremi' });
  if (dt === null) return;
  await act(null, async () => { await uploadDoc(entity, id, file, dt || null); render(); }, 'Fajl je otpremljen.');
}
async function docDel(fid) {
  if (await confirmDlg('Ukloniti dokument iz evidencije?', { danger: true, ok: 'Ukloni' })) await act(null, async () => { await q(db('files').update({ deleted_at: new Date().toISOString() }).eq('id', fid)); render(); }, 'Dokument je uklonjen.');
}

async function clientPick(box, onPick, types) {
  box.innerHTML = `<input class="inp" placeholder="Pretraga klijenta…" autocomplete="off" style="width:100%"><div></div>`;
  const inp = box.firstElementChild, list = box.lastElementChild;
  inp.oninput = debounce(async () => {

    if (types) qb = qb.eq('type', types);

    $$('[data-i]', list).forEach(a => a.onclick = () => { const c = rows[+a.dataset.i]; inp.value = c.display_name; list.innerHTML = ''; onPick(c); });
  }, 250);
}

async function priceSave(plId, btn) {
  await act(btn, async () => {
    const items = await q(db('price_list_items').select('*').eq('price_list_id', plId).is('vehicle_id', null));
    const md = {}; $$('[data-md]').forEach(i => { md[i.dataset.md] = +String(i.value).replace(',', '.') || 0; });
    const ins = [], upd = [], del = [];
    $$('#pmx [data-c]').forEach(inp => {
      const c = inp.dataset.c, t = inp.dataset.t, raw = String(inp.value).replace(/\./g, '').replace(',', '.').trim();
      const ex = items.find(i => i.category_id === c && i.tier_id === t);
      if (raw === '') { if (ex) del.push(ex.id); return; }
      const v = +raw; if (isNaN(v) || v < 0) throw new Error('Neispravna cena u matrici: ' + inp.value);
      if (!ex) ins.push({ price_list_id: plId, category_id: c, tier_id: t, price_per_day: v, max_discount_pct: md[c] ?? 10 });
      else if (+ex.price_per_day !== v || +ex.max_discount_pct !== (md[c] ?? 10)) upd.push({ id: ex.id, price_per_day: v, max_discount_pct: md[c] ?? 10 });
    });
    if (del.length) await q(db('price_list_items').delete().in('id', del));
    if (ins.length) await q(db('price_list_items').insert(ins));
    await Promise.all(upd.map(u => q(db('price_list_items').update({ price_per_day: u.price_per_day, max_discount_pct: u.max_discount_pct }).eq('id', u.id))));
    toast(`Sačuvano: ${ins.length} novih, ${upd.length} izmenjenih, ${del.length} uklonjenih cena.`, 'ok');
    render();
  });
}

async function invSaveItems(btn) {
  await act(btn, async () => {
    const rows = $$('#invItems tbody tr[data-id]');
    const data = rows.map((tr, i) => { const o = { sort: i + 1 }; $$('[data-f]', tr).forEach(inp => { const k = inp.dataset.f; o[k] = ['qty', 'unit_price', 'discount_pct', 'vat_rate'].includes(k) ? +String(inp.value).replace(',', '.') || 0 : inp.value.trim(); }); return { id: tr.dataset.id, o }; });

function roleMatrix() {
  const R = ['admin', 'manager', 'sales', 'operations', 'accounting', 'service'];
  const M = [['Pregled, kalendar, vozila', 'yyyyyy'], ['Finansijski pregled i izveštaji', 'yy--y-'], ['Rezervacije: kreiranje i izmena', 'yyy---'], ['Popust iznad limita', 'yy----'],
    ['Primopredaja vozila', 'yyyy--'], ['Klijenti: pregled', 'yyyyy-'], ['Klijenti: izmena / crna lista', 'yy/-y-'], ['Cenovnici i podešavanja', 'yy----'], ['Ponude i predračuni', 'yyy-y-'],
    ['Fakture, knjižna odobrenja', 'yy--y-'], ['Evidencija uplata', 'yyyyy-'], ['Troškovi: svi / svoji', 'yy-/y/'], ['Nabavne cene vozila', 'yy--y-'], ['Servis, rokovi, blokade', 'yy-y-y'], ['Korisnici i audit log', 'y-----']];
  const sym = { y: '<span class="yes">✓</span>', '/': '<span class="part">○</span>', '-': '<span class="no">—</span>' };
  return `<table class="matrix"><thead><tr><th>Pravo</th>${R.map(r => `<th>${ROLES[r]}</th>`).join('')}</tr></thead><tbody>${M.map(([n, s]) => `<tr><td>${n}</td>${s.split('').map(c => `<td>${sym[c]}</td>`).join('')}</tr>`).join('')}</tbody></table>
    <div class="t-sub mt8">○ = delimično (npr. prodaja menja podatke, ali crnu listu samo menadžer; operativa i servis vide samo svoje troškove). Prava sprovodi baza (RLS), ne samo ekran.</div>`;
}

async function dictDlg(table, id) {
  const d = DICTS[table];
  let r = { active: true, sort: 0 };
  if (id) [r] = await q(db(table).select('*').eq('id', id));
  const inp = c => { const [n, l, ty, rq, opts] = c, o = { req: rq };
    if (ty === 'bool') return F.chk(n, l, r[n]);
    if (ty === 'sel') return F.sel(n, l, optMap(opts, r[n]), o);
    if (ty === 'int') return F.int(n, l, r[n], o);
    if (ty === 'num') return F.num(n, l, r[n], o);
    if (ty === 'color') return fld(l, `<input class="inp" type="color" name="${n}" value="${attr(r[n] || '#7C3AED')}" style="height:36px;padding:2px">`);
    return F.text(n, l, r[n], o); };
  const m = modal({ title: (id ? 'Izmena: ' : 'Novo: ') + d.t, body: `<div class="frow c2">${d.cols.filter(c => c[2] !== 'bool').map(inp).join('')}</div>${d.cols.filter(c => c[2] === 'bool').map(inp).join('')}`,
    foot: `${id && S.me.role === 'admin' ? '<button class="btn dn" id="dDel">Obriši</button>' : ''}<span class="sp"></span><button class="btn" onclick="closeModal()">Odustani</button><button class="btn p" id="dOk">Sačuvaj</button>` });
  $('#dOk', m.el).onclick = e => act(e.target, async () => {
    const f = readForm(m.body);
    if (f.code) f.code = f.code.toUpperCase();
    if (id) await q(db(table).update(f).eq('id', id)); else await q(db(table).insert(f));
    m.close(); await loadLookups(); render();
  }, 'Sačuvano.');
  if ($('#dDel', m.el)) $('#dDel', m.el).onclick = async e => {
    if (!(await confirmDlg('Obrisati stavku? Ako je već korišćena, brisanje neće biti dozvoljeno — tada je označite kao neaktivnu.', { danger: true, ok: 'Obriši' }))) return;
    act(e.target, async () => { await q(db(table).delete().eq('id', id)); m.close(); await loadLookups(); render(); }, 'Obrisano.');
  };
}

.kv td:first-child{color:#555;width:38%}.terms{font-size:8.2pt;color:#222;columns:2;column-gap:18px}.terms p{margin:0 0 4px;break-inside:avoid}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:26px}.sig div{border-top:1px solid #111;padding-top:4px;text-align:center;font-size:8.6pt;min-height:20px}
.sig img{display:block;max-height:60px;max-width:220px;margin:0 auto -6px}.foot{margin-top:18px;font-size:7.8pt;color:#666;border-top:1px solid #ddd;padding-top:6px}
.wm{position:fixed;top:40%;left:0;right:0;text-align:center;font-size:72pt;color:rgba(200,16,46,.08);transform:rotate(-24deg);font-weight:800}
.note{background:#f6f6f6;border-left:3px solid #C8102E;padding:6px 9px;margin-top:10px;font-size:8.8pt}
@media screen{body{max-width:210mm;margin:12px auto;padding:0 12px}.pbar{position:sticky;top:0;background:#fff;padding:8px 0;margin-bottom:8px;border-bottom:1px solid #eee}
.pbar button{font:inherit;padding:7px 14px;border-radius:6px;border:1px solid #C8102E;background:#C8102E;color:#fff;cursor:pointer}}@media print{.pbar{display:none}}`;
const pm = (v, c) => num(v) + ' ' + (c === 'EUR' ? 'EUR' : 'RSD');
function printWin() {
  const w = window.open('', '_blank');
  if (!w) { toast('Pregledač je blokirao novi prozor — dozvolite iskačuće prozore za ovu adresu.', 'err'); return null; }
  w.document.write('<p style="font-family:sans-serif;padding:20px">Priprema dokumenta…</p>');
  return w;
}
function printWrite(w, title, body) {
  w.document.open();
  w.document.write(`<!DOCTYPE html><html lang="sr"><head><meta charset="utf-8"><title>${esc(title)}</title><style>${PRINT_CSS}</style></head><body>
    <div class="pbar"><button onclick="window.print()">Štampaj / sačuvaj kao PDF</button></div>${body}
    <script>window.addEventListener('load',function(){var i=[].slice.call(document.images);Promise.all(i.map(function(x){return x.complete?1:new Promise(function(r){x.onload=x.onerror=r})})).then(function(){setTimeout(function(){window.print()},250)})});<\/script></body></html>`);
  w.document.close();
}
function coHeader(docTitle, docNo, extra = '') {
  const c = S.set.company || {};
  return `<div class="hd"><div class="co"><b>${esc(c.brand || c.name || '')}</b><div>${esc(c.name || '')}${c.address ? ', ' + esc(c.address) : ''}${c.city ? ', ' + esc(c.city) : ''}</div>
    <div>${c.pib ? 'PIB ' + esc(c.pib) : ''}${c.mb ? ' · MB ' + esc(c.mb) : ''}${c.bank_account ? ' · TR ' + esc(c.bank_account) : ''}</div><div>${[c.phone, c.email, c.web].filter(Boolean).map(esc).join(' · ')}</div></div>
    <div class="doc"><h1>${esc(docTitle)}</h1><div class="no">${esc(docNo || '')}</div><div class="muted">${extra}</div></div></div>`;
}
const partyBox = (title, c) => !c ? '' : `<div class="box"><div class="t">${title}</div><b>${esc(c.display_name)}</b>
  <div>${esc([c.address, c.city, c.country].filter(Boolean).join(', '))}</div>
  ${c.type === 'company' ? `<div>${c.pib ? 'PIB ' + esc(c.pib) : ''}${c.mb ? ' · MB ' + esc(c.mb) : ''}</div>${c.legal_rep ? `<div>Zastupnik: ${esc(c.legal_rep)}</div>` : ''}`
    : `<div>${c.id_doc_number ? ({ id_card: 'LK', passport: 'Pasoš', other: 'Dok.' }[c.id_doc_type] || 'Dok.') + ' ' + esc(c.id_doc_number) : ''}${c.birth_date ? ' · rođen/a ' + fmtD(c.birth_date) : ''}</div>`}
  <div class="muted">${[c.phone, c.email].filter(Boolean).map(esc).join(' · ')}</div></div>`;
function priceTable(r, ex, ch) {
  const c = r.currency;
  const rows = [[`Najam vozila — ${r.days} ${plural(r.days, 'dan', 'dana', 'dana')} × ${pm(r.price_per_day, c)}`, pm(r.base_amount, c)]];
  if (+r.discount_amount) rows.push([`Popust ${num(r.discount_pct, 0)} %`, '−' + pm(r.discount_amount, c)]);
  ex.forEach(x => rows.push([x.name + (+x.qty > 1 ? ' ×' + num(x.qty, 0) : ''), pm(x.total, c)]));
  (ch || []).forEach(x => rows.push([x.description, pm(x.total, c)]));
  return `<table><thead><tr><th>Stavka</th><th class="r">Iznos bez PDV</th></tr></thead><tbody>${rows.map(([a, b]) => `<tr><td>${esc(a)}</td><td class="r">${b}</td></tr>`).join('')}
    <tr><td>Osnovica</td><td class="r">${pm(r.subtotal, c)}</td></tr><tr><td>PDV</td><td class="r">${pm(r.vat_amount, c)}</td></tr><tr class="tot"><td>Ukupno sa PDV</td><td class="r">${pm(r.total_amount, c)}</td></tr></tbody></table>`;
}
async function printOffer(id) {
  const w = printWin(); if (!w) return;
  try {
    const [[r], ex] = await Promise.all([q(db('v_reservations').select('*').eq('id', id)), q(db('reservation_extras').select('*').eq('reservation_id', id).order('name'))]);
    const [cl] = await q(db('clients').select('*').eq('id', r.client_id));
    const valid = addDays(new Date(), +(S.set.rental.offer_validity_days || 3));
    printWrite(w, 'Ponuda ' + r.reservation_no, coHeader('Ponuda za najam vozila', r.reservation_no, `Datum: ${fmtD(new Date())}<br>Važi do: ${fmtD(valid)}`) +
      `<div class="grid">${partyBox('Za', cl)}<div class="box"><div class="t">Predmet ponude</div><b>${r.vehicle_id ? esc(r.make + ' ' + r.model) + ' ili slično' : 'Vozilo kategorije ' + esc(r.category_code + ' — ' + r.category_name)}</b>
      <div>Preuzimanje: ${fmtDT(r.pickup_at)}${r.pickup_location ? ', ' + esc(r.pickup_location) : ''}</div><div>Vraćanje: ${fmtDT(r.return_at)}${r.return_location ? ', ' + esc(r.return_location) : ''}</div>
      <div>Limit kilometraže: ${r.km_limit ? int(r.km_limit) + ' km' : 'neograničeno'}</div></div></div>
      <h2>Cena</h2>${priceTable(r, ex)}
      <div class="note">Depozit pri preuzimanju vozila: <b>${pm(r.deposit_amount, r.currency)}</b>. Depozit se vraća po vraćanju vozila i konačnom obračunu.${r.currency === 'EUR' ? ' Plaćanje u dinarskoj protivvrednosti po srednjem kursu NBS na dan plaćanja.' : ''}</div>
      <div class="note">Ponuda je informativna i ne garantuje raspoloživost vozila dok rezervacija ne bude potvrđena.</div>
      <div class="foot">${esc(S.set.documents.invoice_footer || '')}</div>`);
    if (r.status === 'inquiry' && can('resWrite') && await confirmDlg('Označiti rezervaciju kao „Ponuda poslata“?', { ok: 'Označi' })) {
      await rpc('set_reservation_status', { p_id: id, p_status: 'offer_sent', p_note: 'Ponuda odštampana/poslata' }); render();
    }
  } catch (e) { w.close(); toast(e.message, 'err'); }
}
async function printContract(id) {
  const w = printWin(); if (!w) return;
  try {
    const no = await rpc('issue_contract', { p_id: id });
    const [[r], ex, ch, hos] = await Promise.all([q(db('v_reservations').select('*').eq('id', id)), q(db('reservation_extras').select('*').eq('reservation_id', id).order('name')),
      q(db('reservation_charges').select('*').eq('reservation_id', id).is('deleted_at', null)), q(db('handovers').select('*').eq('reservation_id', id))]);
    const [[cl], [v], dr] = await Promise.all([q(db('clients').select('*').eq('id', r.client_id)), q(db('vehicles').select('*').eq('id', r.vehicle_id)),
      r.driver_id ? q(db('drivers').select('*').eq('id', r.driver_id)) : Promise.resolve([])]);
    const hp = hos.find(h => h.type === 'pickup'), hr = hos.find(h => h.type === 'return');
    const sigs = await signedUrls([hp && hp.signature_path, hr && hr.signature_path]);
    const d = dr[0] || (cl.type === 'individual' ? cl : null);
    const st = h => h ? `${fmtDT(h.performed_at)} · ${int(h.odometer)} km · gorivo/baterija ${h.fuel_pct} % · ${CLEAN[h.cleanliness][0].toLowerCase()}${h.damage_notes ? '<br><b>Oštećenja:</b> ' + esc(h.damage_notes) : ''}` : '— (popunjava se pri primopredaji)';
    const terms = String(S.set.documents.contract_terms || '').split(/\n+/).filter(x => x.trim()).map(x => `<p>${esc(x)}</p>`).join('');
    printWrite(w, 'Ugovor ' + no, coHeader('Ugovor o najmu vozila', no, `Datum: ${fmtD(r.contract_issued_at || new Date())}<br>Rezervacija: ${esc(r.reservation_no)}`) +
      `<div class="grid">${partyBox('Najmodavac', { display_name: S.set.company.name, address: S.set.company.address, city: S.set.company.city, type: 'company', pib: S.set.company.pib, mb: S.set.company.mb, phone: S.set.company.phone, email: S.set.company.email })}${partyBox('Najmoprimac', cl)}</div>
      <h2>Vozač i vozilo</h2><table class="kv"><tbody>
      <tr><td>Vozač</td><td>${d ? esc(((d.first_name || '') + ' ' + (d.last_name || '')).trim()) + (d.license_number ? ', vozačka br. ' + esc(d.license_number) : '') + (d.license_expiry ? ', važi do ' + fmtD(d.license_expiry) : '') : '—'}</td></tr>
      ${r.additional_drivers ? `<tr><td>Dodatni vozači</td><td>${esc(r.additional_drivers)}</td></tr>` : ''}
      <tr><td>Vozilo</td><td><b>${esc(v.make + ' ' + v.model)}${v.version ? ' ' + esc(v.version) : ''}</b>, reg. oznaka <b>${esc(v.plate)}</b>${v.vin ? ', šasija ' + esc(v.vin) : ''}${v.color ? ', boja ' + esc(v.color) : ''}</td></tr>
      <tr><td>Period najma</td><td>${fmtDT(r.pickup_at)} – ${fmtDT(r.return_at)} (${r.days} ${plural(r.days, 'dan', 'dana', 'dana')})</td></tr>
      <tr><td>Preuzimanje / vraćanje</td><td>${esc(r.pickup_location || '—')} / ${esc(r.return_location || '—')}</td></tr>
      <tr><td>Limit kilometraže</td><td>${r.km_limit ? int(r.km_limit) + ' km ukupno' : 'neograničeno'}</td></tr>
      <tr><td>Izlazak u inostranstvo</td><td>${ex.some(x => x.code === 'ABR') ? 'ugovoren' : 'nije dozvoljen bez pisane saglasnosti'}</td></tr>
      <tr><td>Depozit</td><td>${pm(r.deposit_amount, r.currency)}</td></tr></tbody></table>
      <h2>Cena najma</h2>${priceTable(r, ex, ch)}
      <h2>Stanje vozila</h2><table class="kv"><tbody><tr><td>Pri preuzimanju</td><td>${st(hp)}</td></tr><tr><td>Pri vraćanju</td><td>${st(hr)}</td></tr></tbody></table>
      <h2>Opšti uslovi najma</h2><div class="terms">${terms || '<p>—</p>'}</div>
      <div class="sig"><div>${esc(L.pr(hp ? hp.performed_by : S.me.id))}<br>za Najmodavca</div><div>${hp && sigs[hp.signature_path] ? `<img src="${attr(sigs[hp.signature_path])}" alt="">` : ''}${esc(cl.display_name)}<br>Najmoprimac</div></div>
      <div class="foot">Najmoprimac potpisom potvrđuje da je preuzeo vozilo u navedenom stanju i da prihvata opšte uslove najma. ${esc(S.set.documents.invoice_footer || '')}</div>`);
    rpc('log_event', { p_action: 'print_contract', p_entity: 'reservations', p_entity_id: id, p_note: no }).catch(() => {});
  } catch (e) { w.close(); toast(e.message, 'err'); }
}
const INV_TITLE = { offer: 'Ponuda', proforma: 'Predračun', advance: 'Avansni račun', invoice: 'Faktura', cash_receipt: 'Gotovinski račun', credit_note: 'Knjižno odobrenje' };
async function printInvoice(id) {
  const w = printWin(); if (!w) return;
  try {
    const [[i], items] = await Promise.all([q(db('v_invoices').select('*').eq('id', id)), q(db('invoice_items').select('*').eq('invoice_id', id).order('sort'))]);
    const [[cl], ref] = await Promise.all([q(db('clients').select('*').eq('id', i.client_id)), i.ref_invoice_id ? q(db('invoices').select('invoice_no,issue_date').eq('id', i.ref_invoice_id)) : Promise.resolve([])]);
    const c = i.currency, rec = groupBy(items, x => num(x.vat_rate, 0)), co = S.set.company;
    const draft = i.status === 'draft';
    printWrite(w, INV_TITLE[i.type] + ' ' + (i.invoice_no || 'nacrt'), (draft ? '<div class="wm">NACRT</div>' : i.status === 'cancelled' ? '<div class="wm">OTKAZANO</div>' : '') +
      coHeader(INV_TITLE[i.type], i.invoice_no || 'NACRT', `Datum izdavanja: ${fmtD(i.issue_date || new Date())}${i.delivery_date ? '<br>Datum prometa: ' + fmtD(i.delivery_date) : ''}${i.due_date ? '<br>Valuta plaćanja: ' + fmtD(i.due_date) : ''}${i.place ? '<br>Mesto: ' + esc(i.place) : ''}`) +
      `<div class="grid">${partyBox('Kupac', cl)}<div class="box"><div class="t">Podaci za plaćanje</div>${co.bank_account ? `Tekući račun: <b>${esc(co.bank_account)}</b><br>` : ''}Poziv na broj: <b>${esc(i.invoice_no || '—')}</b>
      ${i.reservation_no ? `<br>Rezervacija: ${esc(i.reservation_no)}` : ''}${ref[0] ? `<br>Odnosi se na dokument: <b>${esc(ref[0].invoice_no)}</b> od ${fmtD(ref[0].issue_date)}` : ''}</div></div>
      <table><thead><tr><th>R.br.</th><th>Opis</th><th>JM</th><th class="r">Kol.</th><th class="r">Cena</th><th class="r">Rabat</th><th class="r">Osnovica</th><th class="r">PDV %</th><th class="r">PDV</th><th class="r">Ukupno</th></tr></thead><tbody>
      ${items.map((x, n) => `<tr><td>${n + 1}</td><td>${esc(x.description)}</td><td>${esc(x.unit)}</td><td class="r">${num(x.qty, x.qty % 1 ? 2 : 0)}</td><td class="r">${num(x.unit_price)}</td><td class="r">${+x.discount_pct ? num(x.discount_pct, 0) + '%' : ''}</td>
        <td class="r">${num(x.net)}</td><td class="r">${num(x.vat_rate, 0)}</td><td class="r">${num(x.vat)}</td><td class="r">${num(+x.net + +x.vat)}</td></tr>`).join('')}</tbody></table>
      <table style="width:52%;margin-left:auto;margin-top:10px"><tbody>${Object.entries(rec).map(([r, xs]) => `<tr><td>Osnovica ${r} %</td><td class="r">${pm(sum(xs, 'net'), c)}</td></tr><tr><td>PDV ${r} %</td><td class="r">${pm(sum(xs, 'vat'), c)}</td></tr>`).join('')}
      <tr class="tot"><td>Ukupno za plaćanje</td><td class="r">${pm(i.total, c)}</td></tr>${c === 'EUR' && i.exchange_rate ? `<tr><td class="muted">Dinarska protivvrednost (kurs ${num(i.exchange_rate, 4)})</td><td class="r muted">${pm(i.total_rsd, 'RSD')}</td></tr>` : ''}
      ${+i.paid_amount && i.type !== 'credit_note' ? `<tr><td>Plaćeno</td><td class="r">${pm(i.paid_amount, c)}</td></tr><tr><td><b>Preostalo</b></td><td class="r"><b>${pm(i.balance_due, c)}</b></td></tr>` : ''}</tbody></table>
      ${i.notes ? `<div class="note">${esc(i.notes)}</div>` : ''}${['invoice', 'advance', 'proforma'].includes(i.type) && S.set.documents.invoice_note ? `<div class="note">${esc(S.set.documents.invoice_note)}</div>` : ''}
      ${i.type === 'cash_receipt' ? '<div class="note"><b>Interni dokument — nije fiskalni račun.</b> Fiskalni račun izdaje se na fiskalnoj kasi.</div>' : ''}
      ${i.type === 'proforma' || i.type === 'offer' ? '<div class="note">Dokument nije račun i ne predstavlja osnov za odbitak PDV-a.</div>' : ''}
      <div class="sig"><div>Izdao: ${esc(L.pr(i.issued_by))}</div><div>Primio</div></div><div class="foot">${esc(S.set.documents.invoice_footer || '')}</div>`);
  } catch (e) { w.close(); toast(e.message, 'err'); }
}

async function boot() {
  if (!window.supabase || !window.supabase.createClient) {
    document.getElementById('cfgScreen').classList.remove('hidden');
    document.getElementById('cfgScreen').innerHTML = '<div class="card cfg-box"><h2>Biblioteka nije učitana</h2><p class="t2 mt8">Supabase biblioteka sa CDN-a nije dostupna. Proverite internet vezu i osvežite stranicu.</p><button class="btn p mt12" onclick="location.reload()">Osveži</button></div>';
    return;
  }
  if (!initClient()) { showSetup(); return; }
  sb.auth.onAuthStateChange(ev => {
    if (ev === 'SIGNED_OUT' && S.me) { S.me = null; showLogin('Sesija je završena. Prijavite se ponovo.'); }
    if (ev === 'PASSWORD_RECOVERY' && S.me) setPasswordDlg(true);
  });
  try {
    const { data } = await sb.auth.getSession();
    if (!data || !data.session) { showLogin(); return; }
    await enterApp();
  } catch (e) { console.error(e); showLogin(normErr(e).message); }
}
document.addEventListener('DOMContentLoaded', boot);

</script>
